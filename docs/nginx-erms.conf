server {
    # Listen on port 80 (default HTTP port)
    listen 80;
    
    # Replace with your server's IP address or domain name
    server_name 192.168.1.100;

    # =========================================================
    # FRONTEND (React / Vite)
    # =========================================================
    location / {
        # Path to the built frontend files
        # IMPORTANT: Change this to the actual path where you extracted the project
        root /home/ubuntu/Exam-Remuneration-System/frontend/dist;
        index index.html index.htm;
        
        # This is CRITICAL for React Router to work properly
        # If a file isn't found, it falls back to index.html
        try_files $uri $uri/ /index.html;
    }

    # =========================================================
    # BACKEND API (Node.js / Express)
    # =========================================================
    location /api/ {
        # Proxy all traffic starting with /api/ to the local Node.js server
        proxy_pass http://localhost:5000/api/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Forward the real IP of the client to the Node server
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
